name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  PNPM_VERSION: '8'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('ui/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install

      - name: Build UI
        working-directory: ui
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"
          pip install markdown pygments

      - name: Build site structure
        run: |
          # Create output directory structure
          mkdir -p _site/ui
          mkdir -p _site/docs/api/playground
          mkdir -p _site/docs/guides/quick-start
          mkdir -p _site/docs/guides/configuration
          mkdir -p _site/docs/guides/architecture

          # Copy root files
          cp index.html _site/
          cp 404.html _site/

          # Copy built UI (from Vite build)
          cp -r ui/dist/* _site/ui/

          # Copy API spec and playground
          cp docs/api/openapi.yaml _site/docs/api/
          cp docs/api/playground.html _site/docs/api/playground/index.html

          # Copy static docs index
          cp docs/index.html _site/docs/

      - name: Generate markdown pages
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os
          import markdown
          from pathlib import Path

          TEMPLATE = '''<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>{title} - Megazord</title>
              <style>
                  :root {{
                      --bg-dark: #0a0a0f;
                      --bg-surface: #12121a;
                      --bg-surface-light: #1a1a25;
                      --accent: #00d4ff;
                      --success: #00ff88;
                      --warning: #ffaa00;
                      --error: #ff4466;
                      --text: #ffffff;
                      --text-dim: #888899;
                  }}
                  * {{ box-sizing: border-box; margin: 0; padding: 0; }}
                  body {{
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                      background: var(--bg-dark);
                      color: var(--text);
                      line-height: 1.6;
                      min-height: 100vh;
                  }}
                  .container {{
                      max-width: 900px;
                      margin: 0 auto;
                      padding: 2rem;
                  }}
                  .back-link {{
                      display: inline-flex;
                      align-items: center;
                      gap: 0.5rem;
                      color: var(--text-dim);
                      text-decoration: none;
                      font-size: 0.875rem;
                      margin-bottom: 2rem;
                  }}
                  .back-link:hover {{ color: var(--accent); }}
                  h1 {{
                      color: var(--accent);
                      font-size: 2.5rem;
                      margin-bottom: 1.5rem;
                      padding-bottom: 0.75rem;
                      border-bottom: 1px solid var(--bg-surface-light);
                  }}
                  h2 {{
                      color: var(--text);
                      font-size: 1.75rem;
                      margin: 2rem 0 1rem;
                      padding-bottom: 0.5rem;
                      border-bottom: 1px solid var(--bg-surface-light);
                  }}
                  h3 {{
                      color: var(--text);
                      font-size: 1.25rem;
                      margin: 1.5rem 0 0.75rem;
                  }}
                  p {{ margin-bottom: 1rem; color: var(--text); }}
                  a {{ color: var(--accent); text-decoration: none; }}
                  a:hover {{ text-decoration: underline; }}
                  code {{
                      font-family: 'SF Mono', 'Fira Code', monospace;
                      background: var(--bg-surface);
                      padding: 0.2rem 0.4rem;
                      border-radius: 4px;
                      font-size: 0.9em;
                      color: var(--accent);
                  }}
                  pre {{
                      background: var(--bg-surface);
                      padding: 1.25rem;
                      border-radius: 8px;
                      overflow-x: auto;
                      margin: 1rem 0;
                      border: 1px solid var(--bg-surface-light);
                  }}
                  pre code {{
                      background: none;
                      padding: 0;
                      color: var(--text);
                  }}
                  ul, ol {{
                      margin: 1rem 0;
                      padding-left: 2rem;
                  }}
                  li {{ margin-bottom: 0.5rem; }}
                  table {{
                      width: 100%;
                      border-collapse: collapse;
                      margin: 1rem 0;
                      background: var(--bg-surface);
                      border-radius: 8px;
                      overflow: hidden;
                  }}
                  th, td {{
                      text-align: left;
                      padding: 0.75rem 1rem;
                      border-bottom: 1px solid var(--bg-surface-light);
                  }}
                  th {{
                      background: var(--bg-surface-light);
                      font-weight: 600;
                      color: var(--text-dim);
                      text-transform: uppercase;
                      font-size: 0.75rem;
                      letter-spacing: 0.05em;
                  }}
                  blockquote {{
                      border-left: 3px solid var(--accent);
                      margin: 1rem 0;
                      padding: 0.5rem 1rem;
                      background: var(--bg-surface);
                      border-radius: 0 8px 8px 0;
                  }}
                  blockquote p {{ margin: 0; color: var(--text-dim); }}
                  hr {{
                      border: none;
                      border-top: 1px solid var(--bg-surface-light);
                      margin: 2rem 0;
                  }}
                  .nav-footer {{
                      margin-top: 3rem;
                      padding-top: 1.5rem;
                      border-top: 1px solid var(--bg-surface-light);
                      display: flex;
                      justify-content: space-between;
                      gap: 1rem;
                  }}
                  .nav-btn {{
                      display: inline-flex;
                      align-items: center;
                      gap: 0.5rem;
                      padding: 0.75rem 1rem;
                      background: var(--bg-surface);
                      border: 1px solid var(--bg-surface-light);
                      border-radius: 8px;
                      color: var(--text);
                      text-decoration: none;
                      transition: all 0.2s;
                  }}
                  .nav-btn:hover {{
                      background: var(--bg-surface-light);
                      border-color: var(--accent);
                      text-decoration: none;
                  }}
              </style>
          </head>
          <body>
              <div class="container">
                  <a href="{back_url}" class="back-link">← {back_text}</a>
                  {content}
                  <div class="nav-footer">
                      <a href="../../" class="nav-btn">← Docs Home</a>
                      <a href="../../../" class="nav-btn">Main Site →</a>
                  </div>
              </div>
          </body>
          </html>
          '''

          md = markdown.Markdown(extensions=['tables', 'fenced_code', 'codehilite'])

          guides = [
              ('docs/guides/quick-start.md', '_site/docs/guides/quick-start/index.html', 'Quick Start'),
              ('docs/guides/configuration.md', '_site/docs/guides/configuration/index.html', 'Configuration'),
              ('docs/guides/architecture.md', '_site/docs/guides/architecture/index.html', 'Architecture'),
          ]

          for src, dest, title in guides:
              if Path(src).exists():
                  with open(src, 'r') as f:
                      content = f.read()

                  html_content = md.convert(content)
                  md.reset()

                  full_html = TEMPLATE.format(
                      title=title,
                      content=html_content,
                      back_url='../../',
                      back_text='Back to Docs'
                  )

                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  with open(dest, 'w') as f:
                      f.write(full_html)

                  print(f'Generated: {dest}')
              else:
                  print(f'Skipped (not found): {src}')

          print('Markdown pages generated!')
          PYTHON_SCRIPT

      - name: Generate API schemas
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          from megazord.api.models import (
              CompletionRequest, CompletionResponse,
              ChatCompletionRequest, ChatCompletionResponse,
              HealthResponse, GPUResponse, ModelResponse,
              QueueResponse, AlarmResponse, StatsResponse
          )
          from megazord.core.udts import UDT_GPU, UDT_Model, UDT_Request, UDT_Alarm
          from megazord.core.states import ST, RS, RM, AlarmClass
          from megazord.templates import generate_all_templates

          # API Models
          api_models = [
              CompletionRequest, CompletionResponse,
              ChatCompletionRequest, ChatCompletionResponse,
              HealthResponse, GPUResponse, ModelResponse,
              QueueResponse, AlarmResponse, StatsResponse
          ]

          schemas = {}
          for model in api_models:
              schemas[model.__name__] = model.model_json_schema()

          # Add state enums
          schemas['States'] = {
              'ST': {name: value for name, value in ST.__members__.items()},
              'RS': {name: value for name, value in RS.__members__.items()},
              'RM': {name: value for name, value in RM.__members__.items()},
              'AlarmClass': {name: value for name, value in AlarmClass.__members__.items()},
          }

          with open('_site/docs/api/schemas.json', 'w') as f:
              json.dump(schemas, f, indent=2)

          # Generate UDT templates
          templates = generate_all_templates()
          with open('_site/docs/api/templates.json', 'w') as f:
              json.dump(templates, f, indent=2, default=str)

          print(f'Generated schemas for {len(api_models)} API models')
          print(f'Generated UDT templates for {len(templates["udts"])} UDTs')
          PYTHON_SCRIPT

      - name: Verify site structure
        run: |
          echo "=== Site Structure ==="
          find _site -type f | sort
          echo ""
          echo "=== Directory tree ==="
          find _site -type d | sort

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
