name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  PNPM_VERSION: '8'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build UI
        working-directory: ui
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"

      - name: Build site structure
        run: |
          # Create output directory
          mkdir -p _site/ui _site/docs/api _site/docs/guides

          # Copy root index.html (main navigation entry point)
          cp index.html _site/
          cp 404.html _site/

          # Copy UI build to /ui/
          cp -r ui/dist/* _site/ui/

          # Copy documentation
          cp docs/index.md _site/docs/
          cp docs/api/openapi.yaml _site/docs/api/
          cp -r docs/guides/* _site/docs/guides/ 2>/dev/null || true

          # Generate API schemas from UDTs
          python -c "
          import json
          from megazord.api.models import (
              CompletionRequest, CompletionResponse,
              ChatCompletionRequest, ChatCompletionResponse,
              HealthResponse, GPUResponse, ModelResponse,
              QueueResponse, AlarmResponse, StatsResponse
          )
          from megazord.core.udts import UDT_GPU, UDT_Model, UDT_Request, UDT_Alarm
          from megazord.core.states import ST, RS, RM, AlarmClass

          # API Models
          api_models = [
              CompletionRequest, CompletionResponse,
              ChatCompletionRequest, ChatCompletionResponse,
              HealthResponse, GPUResponse, ModelResponse,
              QueueResponse, AlarmResponse, StatsResponse
          ]

          schemas = {}
          for model in api_models:
              schemas[model.__name__] = model.model_json_schema()

          # Add state enums
          schemas['States'] = {
              'ST': {name: value for name, value in ST.__members__.items()},
              'RS': {name: value for name, value in RS.__members__.items()},
              'RM': {name: value for name, value in RM.__members__.items()},
              'AlarmClass': {name: value for name, value in AlarmClass.__members__.items()},
          }

          with open('_site/docs/api/schemas.json', 'w') as f:
              json.dump(schemas, f, indent=2)

          print(f'Generated schemas for {len(api_models)} API models')
          "

          # Create docs index.html
          cat > _site/docs/index.html << 'DOCSHTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Megazord Documentation</title>
              <style>
                  body { font-family: monospace; background: #0A0A0F; color: #E5E5E5; margin: 0; padding: 2rem; }
                  a { color: #06B6D4; }
                  h1 { color: #06B6D4; }
                  .container { max-width: 800px; margin: 0 auto; }
                  pre { background: #1A1A2E; padding: 1rem; border-radius: 8px; overflow-x: auto; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Megazord Documentation</h1>
                  <nav>
                      <ul>
                          <li><a href="/">Home</a></li>
                          <li><a href="/ui/">Dashboard</a></li>
                          <li><a href="./api/openapi.yaml">OpenAPI Spec</a></li>
                          <li><a href="./api/schemas.json">JSON Schemas</a></li>
                          <li><a href="./guides/quick-start.md">Quick Start</a></li>
                          <li><a href="./guides/configuration.md">Configuration</a></li>
                          <li><a href="./guides/architecture.md">Architecture</a></li>
                      </ul>
                  </nav>
              </div>
          </body>
          </html>
          DOCSHTML

          echo "Site structure:"
          find _site -type f | head -50

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
